name: CMS AI Automation

on:
  workflow_dispatch:
    inputs:
      conversation_id:
        description: CMS AI conversation ID
        required: true
        type: string
      job_id:
        description: CMS AI job ID
        required: true
        type: string

concurrency:
  group: cms-ai-${{ inputs.conversation_id }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  implement:
    if: ${{ inputs.job_id != '' }}
    name: CMS AI request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: acecore-systems/cms-ai/runner@v1
        with:
          job-id: ${{ inputs.job_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
