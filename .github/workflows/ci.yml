name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test:seo

      - name: Test workflow safety invariants
        run: yarn test:workflow

      - name: Build
        run: yarn build

      - name: Audit dependencies
        run: yarn npm audit --all --recursive --severity high

  astro-sveltia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: poc/astro-sveltia
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: poc/astro-sveltia/package-lock.json

      - name: Install Astro dependencies
        run: npm ci

      - name: Generate Cloudflare types
        run: npm run cf:typegen

      - name: Verify generated Cloudflare types
        run: |
          git diff --exit-code -- worker-configuration.d.ts
          test -z "$(git status --porcelain --untracked-files=all -- worker-configuration.d.ts)"

      - name: Typecheck Astro and Pages Functions
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build and validate Astro Wiki
        run: npm run build

      - name: Bundle Pages Functions
        run: npx wrangler pages functions build

      - name: Audit Astro dependencies
        run: npm audit --audit-level=high

  discord-oidc-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: poc/discord-oidc-broker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: poc/discord-oidc-broker/.node-version
          cache: npm
          cache-dependency-path: poc/discord-oidc-broker/package-lock.json

      - name: Install broker dependencies
        run: npm ci

      - name: Generate Cloudflare types
        run: npm run cf:typegen

      - name: Verify generated Cloudflare types
        run: |
          git diff --exit-code -- worker-configuration.d.ts
          test -z "$(git status --porcelain --untracked-files=all -- worker-configuration.d.ts)"

      - name: Typecheck broker
        run: npm run check

      - name: Run broker Worker tests
        run: npm run test:unit

      - name: Run signing-key helper tests
        run: npm run test:keygen

      - name: Validate broker deployment bundle
        run: npx wrangler deploy --dry-run

      - name: Audit broker dependencies
        run: npm audit --audit-level=high
